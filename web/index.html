<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>helm</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23d97757' stroke-width='3'/%3E%3Cpath d='M16 2v8M16 22v8M2 16h8M22 16h8' stroke='%23d97757' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="side">
  <a class="brand" href="#/overview"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="3"/><path d="M16 2v8M16 22v8M2 16h8M22 16h8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><span>helm</span></a>
  <nav id="nav" aria-label="views"></nav>
  <div class="side-foot">
    <button type="button" id="pal-open" class="quiet" title="command palette (ctrl k)"><kbd>ctrl k</kbd></button>
    <button type="button" id="theme" class="quiet" aria-label="toggle theme">◐</button>
  </div>
</aside>
<div class="page">
  <header class="top">
    <h1 id="view-title"></h1>
    <div class="summary" id="summary"></div>
    <div class="conn" id="conn">connecting</div>
  </header>
  <div class="filters" id="filters" role="search"></div>
  <main id="main"></main>
</div>
<aside id="drawer" class="drawer" hidden aria-label="work detail"></aside>
<dialog id="log"><form method="dialog"><header><span id="log-title"></span><button aria-label="close">✕</button></header><pre id="log-body"></pre></form></dialog>
<dialog id="palette" class="palette" aria-label="command palette"><input id="pal-input" type="text" placeholder="Jump to a view, issue, epic, repository or session" autocomplete="off" spellcheck="false"><ul id="pal-list" role="listbox"></ul></dialog>
<dialog id="keys" class="keys"><form method="dialog"><header><span>Keys</span><button aria-label="close">✕</button></header><div id="keys-list"></div></form></dialog>
<script type="module" src="main.js"></script>
</body>
</html>
